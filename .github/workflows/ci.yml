name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit + integration tests (workerd)
        run: npm test
      - name: End-to-end (wrangler dev + mock Graph API)
        run: npm run test:e2e
      - name: Browser test (Playwright + Chrome)
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: docs/*.png
